name: git
description: Git operations scoped to the task workspace
allowed_operations:
  - status
  - diff
  - log
  - add
  - commit
  - checkout
  - branch
blocked_operations:
  - push
  - force-push
  - reset --hard
  - clean -f
auto_stage_on_commit: false
require_message: true
message_format: "feat|fix|chore|test|docs: <description>"
